# Scheme registry - the single source of truth for ingestion + scheme routing.
#
# HOW TO ADD DOCUMENTS (recommended):
#   1. Open https://www.myscheme.gov.in, search the scheme, open its page.
#   2. Browser -> Print -> "Save as PDF" -> save as data/raw/<id>.pdf
#      (also download official guideline PDFs from the ministry site as data/raw/<id>_guidelines.pdf)
#   3. Any file in data/raw/ whose name starts with <id> is picked up automatically
#      (.pdf, .html, .txt, .md).
#   If no local file exists, the pipeline tries to fetch `urls` (many govt sites are
#   JavaScript-heavy, so saved PDFs give much better text).
#
# aliases are used by the scheme router (English, Hindi, abbreviations) - lowercase.

schemes:
