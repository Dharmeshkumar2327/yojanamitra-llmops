[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yojanamitra"
version = "1.0.0"
description = "YojanaMitra - production LLMOps RAG support bot for Indian Government schemes (English + Hindi)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dharmesh Kumar" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.40",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "redis>=5.0",
    "langfuse>=3.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.5", "pre-commit>=3.7", "locust>=2.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["yojanamitra", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "I001"]
"ui/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
